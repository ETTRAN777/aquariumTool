    <!--
      GoatCounter's own count.js (github.com/arp242/goatcounter,
      public/count.js) implements the #toggle-goatcounter opt-out link as
      a one-time check of location.hash on script load — toggling a
      localStorage flag and showing a native alert() — and never clears
      the hash afterward. That collides with this app's HashRouter, which
      reads location.hash to pick a route: "#toggle-goatcounter" matches
      no real route, so it would render the catch-all (CreateTank) instead
      of wherever the person actually meant to land, and the stale hash
      would stick around to accidentally re-toggle on a future reload.

      Handled here instead — before React mounts, and deterministically
      before GoatCounter's own script has a chance to run its check too,
      since that script loads async with no guaranteed order relative to
      anything else on the page. This replicates GoatCounter's own logic
      exactly (same localStorage key/value its own filter() function
      reads), then strips the hash via replaceState the moment the alert
      is dismissed, so HashRouter never sees anything but a clean URL.
      GoatCounter's own script still loads normally for real pageview
      counting either way — this only ever intercepts the one-time toggle
      case, never suppresses the counting script itself.

      Also handles the case GoatCounter's own docs warn about directly:
      editing just the hash on a page already open is a same-page
      navigation, not a full reload — browsers don't re-run <head>
      scripts for that, only hashchange listeners, which is why
      GoatCounter's own instructions say an F5 may be needed. Since
      HashRouter already has to listen for hashchange to do client-side
      routing without a full reload, the same check gets attached there
      too, so this actually works without the manual refresh instead of
      inheriting that limitation.

      One more subtlety this needs to account for: history.replaceState
      deliberately does NOT fire any navigation event — that's the whole
      point of "replace," a silent URL update. HashRouter's own internal
      routing needs to find out regardless, so — checked directly against
      the actual installed react-router source (createHashHistory /
      getUrlBasedHistory in react-router/dist) rather than assumed —
      react-router listens for a real browser "popstate" event
      specifically, not "hashchange" at all, and its handler
      (handlePop()) takes no payload; it just re-reads window.location
      and history.state fresh whenever it's invoked. So a synthetic
      PopStateEvent with no state needed is what actually reaches it —
      dispatching a hashchange event here (an earlier attempt at this
      same fix) compiles fine and never throws, but silently never
      reaches react-router's listener at all, which is exactly why that
      version fixed the alert timing but not the stuck-on-the-wrong-route
      symptom that followed it.
    -->
    <script>
      function checkGoatCounterToggle() {
        if (location.hash !== '#toggle-goatcounter') return;
        if (localStorage.getItem('skipgc') === 't') {
          localStorage.removeItem('skipgc');
          alert('GoatCounter tracking is now ENABLED in this browser.');
        } else {
          localStorage.setItem('skipgc', 't');
          alert('GoatCounter tracking is now DISABLED in this browser.');
        }
        history.replaceState(null, '', location.pathname + location.search);
        window.dispatchEvent(new PopStateEvent('popstate'));
      }
      checkGoatCounterToggle();
      window.addEventListener('hashchange', checkGoatCounterToggle);
    </script>

      <main style="max-width: 640px; margin: 3rem auto; padding: 0 1.5rem; font-family: sans-serif; line-height: 1.6;">
        <h1>Tank Tracker — Plan &amp; Log</h1>
        <p>
          A free, local-first planning and tracking tool for freshwater and
          saltwater/reef aquariums — starting from the moment a tank is
          still just an idea, not only after the first water test. No
          account — all data stays in your browser by default, with two
          narrow, explicit exceptions: an optional one-click Google Drive
          backup (only ever runs when you click it) and non-identifying
          page-view analytics (<a href="https://www.goatcounter.com/">GoatCounter</a> —
          no cookies, no individual tracking, just aggregate counts of
          which pages get visited). This page requires JavaScript to run;
          here's a summary of what it does for anyone (or anything)
          reading without it.
        </p>

        <h2>Getting started</h2>
        <p>
          A new tank starts from one of seven templates — Shrimp / Invert
          Colony, Livebearers &amp; Fry, Community Fish, Solo Fish /
          Centerpiece, Planted-Only, Reef Tank (saltwater), or Blank. Six of
          the seven include a guided questionnaire that asks trait-based
          questions (never requiring the user to already know species
          names) and produces a starter roster scaled to the tank's size.
          Tanks can also be created by importing a JSON backup — see
          <a href="./docs.txt">/docs.txt</a> for the full format reference, including
          guidance for generating one with an AI assistant.
        </p>

        <h2>What's tracked, per tank</h2>
        <ul>
          <li><strong>Roster</strong> — every physical thing going into the tank, moved through idea &rarr; wishlist &rarr; ordered &rarr; arrived &rarr; acclimating &rarr; established, with Estimate/Actual cost tracking that merges into one Total once everything's ordered.</li>
          <li><strong>Build checklist</strong> — ordered setup steps that can depend on other steps or on a roster item reaching a given status.</li>
          <li><strong>Weekly log</strong> — free-text entries with mood rating, water parameters, custom field values, and photos.</li>
          <li><strong>Schedule</strong> — recurring or one-off maintenance reminders in a calendar view, automatically linked to the day's log entry when one exists.</li>
          <li><strong>Parameters</strong> — every numeric water parameter and custom field charts itself automatically from log history.</li>
          <li><strong>Timeline</strong> — a proportional, phase-tagged strip of the whole build plus a chronological feed of every log entry and milestone, some auto-derived (a phase change, a roster item's first appearance) and some hand-recorded.</li>
          <li><strong>Story Mode</strong> — a full-screen, tap-through recap of the tank's build (phase pacing, milestone highlights, mood trends), built entirely from real data already on the tank.</li>
          <li><strong>Embeddable widget</strong> — a live tank status card (name, age, phase, next task) that can be dropped into the user's own page via <code>&lt;iframe&gt;</code>.</li>
          <li><strong>Custom fields</strong> — definable per tank (number/text/boolean), with a preset library filtered by whether the tank is freshwater or saltwater.</li>
          <li><strong>AI concept image prompts</strong> — a Dashboard button assembles a tank's real roster into a ready-to-paste prompt for an AI image tool, to visualize a build before buying anything.</li>
        </ul>

        <p>
          Full JSON import/export format, including guidance for AI
          assistants generating a plan on a user's behalf, is documented at
          <a href="./docs.txt">/docs.txt</a>.
        </p>
